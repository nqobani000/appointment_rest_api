spring.application.name=appointment_rest_api


spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/bank_appointments
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.continue-on-error=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

app.cache.default-ttl=24h
app.cache.maximum-size=1000
app.cache.max-key-length=100
app.cache.max-page-size=100
app.cache.max-page-number=100
app.cache.ttl.services=24h
app.cache.ttl.serviceById=24h
app.cache.ttl.branches=24h

spring.jpa.properties.hibernate.default_batch_fetch_size=50