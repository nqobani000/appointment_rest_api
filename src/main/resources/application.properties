spring.application.name=appointment_rest_api

# Local runs read secrets from .env; real environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/bank_appointments
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.continue-on-error=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

app.cache.default-ttl=24h
app.cache.maximum-size=1000
app.cache.max-key-length=100
app.cache.max-page-size=100
app.cache.max-page-number=100
app.cache.ttl.services=24h
app.cache.ttl.serviceById=24h
app.cache.ttl.branches=24h
app.cache.ttl.branchServices=24h

spring.jpa.properties.hibernate.default_batch_fetch_size=50

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl=1h

app.guest-verification.code-ttl=10m
app.guest-verification.max-attempts=5
app.guest-verification.resend-cooldown=1m

# "logging" prints emails to the console (dev only); use "smtp" with the spring.mail.* settings below
app.notifications.sender=${NOTIFICATIONS_SENDER:logging}
app.notifications.from=${MAIL_FROM:no-reply@appointments.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
